[package]
name = "hidraw"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Linux hidraw for daemons: sysfs discovery, feature and input reports, poll with timeout, device-gone detection"
authors = ["GregDuhamel <gregory.duhamel@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/GregDuhamel/hidraw"
keywords = ["hidraw", "hid", "linux", "sysfs", "udev"]
categories = ["os::linux-apis", "hardware-support"]
publish = false

[dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
